<div class="page-content container-fluid company-form-page">
  <nav class="detail-breadcrumb">
    <a href="#/entreprises">Entreprises</a>
    <i data-lucide="chevron-right"></i>
    <span id="formModeLabel">Nouvelle entreprise</span>
  </nav>

  <section class="page-heading">
    <div>
      <p class="eyebrow">Registre national</p>
      <h1 id="companyFormTitle">Créer une entreprise</h1>
      <p id="companyFormSubtitle">Enregistrez les données officielles de l’entreprise et ses sous-ressources.</p>
    </div>
    <div class="heading-actions">
      <a href="#/entreprises" class="btn btn-outline-secondary app-btn" id="cancelCompanyForm">
        <i data-lucide="x"></i>Annuler
      </a>
      <button class="btn btn-primary app-btn" id="submitCompany" type="button">
        <i data-lucide="check"></i>Enregistrer l’entreprise
      </button>
    </div>
  </section>

  <section class="company-form-api-state" id="companyFormApiState" hidden aria-live="polite"></section>

  <section class="form-stepper" id="companyStepper">
    <button class="active" data-step="1" type="button"><span>1</span><div><strong>Identification</strong><small>Informations légales</small></div></button><i></i>
    <button data-step="2" type="button"><span>2</span><div><strong>Localisation</strong><small>Siège et sites</small></div></button><i></i>
    <button data-step="3" type="button"><span>3</span><div><strong>Activités</strong><small>Produits et services</small></div></button><i></i>
    <button data-step="4" type="button"><span>4</span><div><strong>Contacts</strong><small>Interlocuteurs</small></div></button><i></i>
    <button data-step="5" type="button"><span>5</span><div><strong>Vérification</strong><small>Contrôle final</small></div></button>
  </section>

  <form id="companyForm" novalidate>
    <section id="formStepContent"></section>
    <footer class="form-navigation">
      <button type="button" class="btn btn-outline-secondary app-btn" id="previousStep" hidden><i data-lucide="arrow-left"></i>Précédent</button>
      <span id="formProgress">Étape 1 sur 5</span>
      <button type="button" class="btn btn-primary app-btn" id="nextStep">Continuer<i data-lucide="arrow-right"></i></button>
    </footer>
  </form>

  <div class="save-indicator" id="saveIndicator" hidden><i data-lucide="circle-check"></i><span></span></div>
</div>
