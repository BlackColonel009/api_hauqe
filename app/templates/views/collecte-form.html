<div class="page-content container-fluid company-form-page">
  <nav class="detail-breadcrumb">
    <a href="#/collectes">Collectes</a>
    <i data-lucide="chevron-right"></i>
    <span id="collectFormMode">Nouvelle mission</span>
  </nav>

  <section class="page-heading">
    <div>
      <p class="eyebrow">Collecte terrain</p>
      <h1 id="collectFormTitle">
        Préparer une mission et sa fiche de collecte
      </h1>
      <p>
        Le brouillon est enregistré côté serveur.
        Aucun stockage local n’est utilisé.
      </p>
    </div>

    <div class="heading-actions">
      <a
        href="#/collectes"
        class="btn btn-outline-secondary app-btn"
      >
        <i data-lucide="x"></i>
        Fermer
      </a>

      <button
        class="btn btn-outline-secondary app-btn"
        id="createRevision"
        type="button"
        hidden
      >
        <i data-lucide="git-branch-plus"></i>
        Nouvelle révision
      </button>

      <button
        class="btn btn-outline-secondary app-btn"
        id="saveCollectDraft"
        type="button"
      >
        <i data-lucide="save"></i>
        Enregistrer le brouillon
      </button>

      <button
        class="btn btn-primary app-btn"
        id="submitCollect"
        type="button"
      >
        <i data-lucide="send"></i>
        Soumettre
      </button>
    </div>
  </section>

  <section
    class="dashboard-api-state"
    id="collectFormState"
    hidden
  ></section>

  <section class="form-stepper" id="collectStepper">
    <button class="active" data-step="1" type="button">
      <span>1</span>
      <div>
        <strong>Mission</strong>
        <small>Campagne, zone, affectation</small>
      </div>
    </button>
    <i></i>

    <button data-step="2" type="button">
      <span>2</span>
      <div>
        <strong>Entreprise</strong>
        <small>Titulaire & déclarant</small>
      </div>
    </button>
    <i></i>

    <button data-step="3" type="button">
      <span>3</span>
      <div>
        <strong>Offres</strong>
        <small>Produits & services déclarés</small>
      </div>
    </button>
    <i></i>

    <button data-step="4" type="button">
      <span>4</span>
      <div>
        <strong>Certifications</strong>
        <small>Déclarations terrain</small>
      </div>
    </button>
    <i></i>

    <button data-step="5" type="button">
      <span>5</span>
      <div>
        <strong>Preuves</strong>
        <small>Documents & observations</small>
      </div>
    </button>
    <i></i>

    <button data-step="6" type="button">
      <span>6</span>
      <div>
        <strong>Soumission</strong>
        <small>Contrôle backend</small>
      </div>
    </button>
  </section>

  <form id="collectForm" novalidate>
    <section id="collectFormContent"></section>

    <footer class="form-navigation">
      <button
        type="button"
        class="btn btn-outline-secondary app-btn"
        id="collectPrevious"
        hidden
      >
        <i data-lucide="arrow-left"></i>
        Précédent
      </button>

      <span id="collectProgress">Étape 1 sur 6</span>

      <button
        type="button"
        class="btn btn-primary app-btn"
        id="collectNext"
      >
        Continuer
        <i data-lucide="arrow-right"></i>
      </button>
    </footer>
  </form>
</div>
