<div class="page-content container-fluid certification-detail-page">
  <nav class="detail-breadcrumb">
    <a href="#/organismes">Organismes</a>
    <i data-lucide="chevron-right"></i>
    <span id="bodyBreadcrumb">Détail</span>
  </nav>

  <section class="dashboard-api-state" id="bodyDetailState" hidden></section>

  <section class="cert-profile panel" id="bodyProfile">
    <div class="cert-profile-main">
      <span class="cert-profile-logo" id="bodyLogo">OC</span>
      <div>
        <div class="profile-title-line">
          <h1 id="bodyName">Chargement…</h1>
          <span class="cert-status verify" id="bodyStatus">
            <i></i>—
          </span>
        </div>
        <p id="bodyType">Organisme certificateur</p>
        <div class="profile-refs" id="bodyRefs"></div>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn btn-outline-secondary app-btn" id="bodyVerify" type="button">
        <i data-lucide="search-check"></i>Vérifier
      </button>
      <a href="#/organismes" class="btn btn-primary app-btn" id="bodyEdit">
        <i data-lucide="square-pen"></i>Modifier
      </a>
    </div>
  </section>

  <section class="cert-detail-kpis" id="bodyDetailKpis"></section>

  <div class="detail-tabs">
    <button class="active" data-tab="overview">Vue d’ensemble</button>
    <button data-tab="accreditations">
      Accréditations <b id="accreditationCount">0</b>
    </button>
    <button data-tab="certificates">
      Certificats délivrés <b id="certificateCount">0</b>
    </button>
    <button data-tab="documents">
      Documents <b id="documentCount">0</b>
    </button>
  </div>

  <section id="bodyTabContent"></section>
  <dialog id="organismeVerificationDialog" class="organisme-verification-dialog">
    <form id="organismeVerificationForm">
      <header class="organisme-verification-header">
        <span><i data-lucide="badge-check"></i></span>
        <div><small>Vérification de l’organisme</small><h2>Choisir une décision</h2></div>
        <button type="button" class="dialog-close" id="organismeVerificationClose" aria-label="Fermer"><i data-lucide="x"></i></button>
      </header>
      <div class="organisme-verification-body">
        <p>Le statut doit exprimer la décision prise après contrôle des pièces de l’organisme.</p>
        <label><span>Décision</span><select id="organismeVerificationStatus" required><option value="A_VERIFIER">Pas encore vérifié — conserver « À vérifier »</option><option value="RECONNU">Reconnu — confirmer l’organisme</option></select></label>
        <label><span>Motif ou référence du contrôle</span><textarea id="organismeVerificationReason" rows="4" required minlength="3" maxlength="2000" placeholder="Ex. Accréditation et coordonnées contrôlées le…"></textarea></label>
        <p class="organisme-verification-error" id="organismeVerificationError" role="alert" hidden></p>
      </div>
      <footer><button type="button" class="btn btn-outline-secondary app-btn" id="organismeVerificationCancel">Annuler</button><button type="submit" class="btn btn-primary app-btn" id="organismeVerificationSave">Enregistrer la décision</button></footer>
    </form>
  </dialog>
</div>
