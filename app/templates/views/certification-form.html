<div class="page-content container-fluid company-form-page">
  <nav class="detail-breadcrumb">
    <a href="#/certifications">Certifications</a>
    <i data-lucide="chevron-right"></i>
    <span id="certFormMode">Nouvelle certification</span>
  </nav>

  <section class="page-heading">
    <div>
      <p class="eyebrow">Registre national</p>
      <h1 id="certFormTitle">Ajouter une certification</h1>
      <p>
        Enregistrez le titulaire, le référentiel, l’organisme,
        les dates et les justificatifs disponibles.
      </p>
    </div>

    <div class="heading-actions">
      <a href="#/certifications" class="btn btn-outline-secondary app-btn">
        <i data-lucide="x"></i>Annuler
      </a>

      <button class="btn btn-primary app-btn" id="submitCert" type="button">
        <i data-lucide="check"></i>Enregistrer
      </button>
    </div>
  </section>

  <section class="dashboard-api-state" id="certFormState" hidden></section>

  <section class="form-stepper" id="certStepper">
    <button class="active" data-step="1" type="button">
      <span>1</span>
      <div><strong>Identification</strong><small>Titulaire et norme</small></div>
    </button>
    <i></i>

    <button data-step="2" type="button">
      <span>2</span>
      <div><strong>Organisme</strong><small>Certificateur et accréditation</small></div>
    </button>
    <i></i>

    <button data-step="3" type="button">
      <span>3</span>
      <div><strong>Portée & dates</strong><small>Validité du certificat</small></div>
    </button>
    <i></i>

    <button data-step="4" type="button">
      <span>4</span>
      <div><strong>Documents</strong><small>Preuves justificatives</small></div>
    </button>
    <i></i>

    <button data-step="5" type="button">
      <span>5</span>
      <div><strong>Vérification</strong><small>Contrôle final</small></div>
    </button>
  </section>

  <form id="certForm" novalidate>
    <section id="certFormContent"></section>

    <footer class="form-navigation">
      <button
        type="button"
        class="btn btn-outline-secondary app-btn"
        id="certPrevious"
        hidden
      >
        <i data-lucide="arrow-left"></i>Précédent
      </button>

      <span id="certProgress">Étape 1 sur 5</span>

      <button
        type="button"
        class="btn btn-primary app-btn"
        id="certNext"
      >
        Continuer<i data-lucide="arrow-right"></i>
      </button>
    </footer>
  </form>
</div>
